name: Temporary lockfile generation

on:
  push:
    branches:
      - build/betterbauang-v0
    paths:
      - .github/workflows/lockfile-temp.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Generate package lock
        run: npm install --package-lock-only

      - name: Commit package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update lockfile for Wrangler"
          git push origin HEAD:build/betterbauang-v0
