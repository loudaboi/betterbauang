name: Temporary local verification bundle

on:
  push:
    branches:
      - build/betterbauang-v0
    paths:
      - .github/workflows/local-verification-temp.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare verification bundle
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=build --exclude=.react-router -czf "$RUNNER_TEMP/verification-source.tar.gz" .
          tar -czf "$RUNNER_TEMP/npm-cache.tar.gz" -C "$HOME" .npm

      - name: Upload verification bundle
        uses: actions/upload-artifact@v4
        with:
          name: local-verification-bundle
          path: |
            ${{ runner.temp }}/verification-source.tar.gz
            ${{ runner.temp }}/npm-cache.tar.gz
